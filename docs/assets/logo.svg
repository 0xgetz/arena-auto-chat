<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="arena-auto-chat logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="55%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#23D3A6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="#0B0E17"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="url(#g)" stroke-width="3"/>

  <!-- Chat bubble -->
  <path d="M34 40 h60 a14 14 0 0 1 14 14 v26 a14 14 0 0 1 -14 14 h-30 l-16 14 v-14 h-14 a14 14 0 0 1 -14 -14 v-26 a14 14 0 0 1 14 -14 z"
        fill="url(#g)" opacity="0.18"/>
  <path d="M34 40 h60 a14 14 0 0 1 14 14 v26 a14 14 0 0 1 -14 14 h-30 l-16 14 v-14 h-14 a14 14 0 0 1 -14 -14 v-26 a14 14 0 0 1 14 -14 z"
        fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Three dots: the automated exchange -->
  <circle cx="50" cy="67" r="6" fill="url(#g2)"/>
  <circle cx="66" cy="67" r="6" fill="url(#g2)"/>
  <circle cx="82" cy="67" r="6" fill="url(#g2)"/>

  <!-- Small terminal cursor, hinting at the automation -->
  <rect x="86" y="90" width="22" height="6" rx="3" fill="#23D3A6"/>
</svg>
